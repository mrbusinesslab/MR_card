name: Optimize card images

on:
  push:
    branches: [main]
    paths:
      - "ai-MRbot/templates/**/*.png"
      - "ai-MRbot/templates/**/card_*.json"
      - "ai-MRbot/legacy_app.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-card-images-main
  cancel-in-progress: false

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Collect changed PNG files
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
            before="$(git rev-list --max-parents=0 HEAD)"
          fi

          git diff --name-only "$before" "$after" -- 'ai-MRbot/templates/**/*.png' > /tmp/changed-pngs.txt
          if git diff --name-only "$before" "$after" -- \
            'ai-MRbot/legacy_app.py' 'ai-MRbot/templates/**/card_*.json' \
            | grep -q .; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Optimize and update JSON
        shell: bash
        run: |
          args=()
          if [[ "${{ steps.changes.outputs.all }}" == "true" ]]; then
            args+=(--all)
          else
            while IFS= read -r file; do
              [[ -n "$file" ]] && args+=(--changed-file "$file")
            done < /tmp/changed-pngs.txt
          fi
          python scripts/prepare_card_assets.py "${args[@]}"

      - name: Commit optimized assets
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- ai-MRbot/templates)" ]]; then
            echo "沒有需要提交的圖片變更"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-MRbot/templates
          git commit -m "Optimize card images and refresh versions"
          git push
