<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe8" id="themeColor">
  <meta name="description" content="小如如的專屬電子名片｜MR BUSINESS LAB">
  <title>小如如的電子名片｜MR BUSINESS LAB</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231b1917'/%3E%3Ctext x='32' y='40' font-size='26' text-anchor='middle' fill='%23d6ad73' font-family='serif'%3EMR%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css?v=2">
</head>
<body>
  <main class="page-shell">
    <header class="site-header">
      <a class="brand" href="https://mrbusinesslab.github.io/official/MR/" aria-label="MR BUSINESS LAB 官網">
        <span class="brand-mark">MR</span>
        <span class="brand-copy">
          <strong>MR BUSINESS LAB</strong>
          <small>PERSONAL BUSINESS CARD</small>
        </span>
      </a>
      <div class="version-badge" aria-label="目前版本與更新日期">
        <span class="status-dot" aria-hidden="true"></span>
        <span>目前版本 <strong id="versionLabel">最新版</strong></span>
        <time id="versionDate">讀取中</time>
      </div>
    </header>

    <section class="hero" aria-labelledby="pageTitle">
      <div class="phone-column">
        <div class="phone-frame">
          <div class="speaker" aria-hidden="true"></div>
          <div class="card-viewport" id="cardViewport" aria-live="polite">
            <div class="loading-state" id="loadingState">正在載入電子名片…</div>
          </div>
          <div class="page-dots" id="pageDots" aria-label="名片頁數"></div>
        </div>
        <p class="swipe-hint">左右滑動查看五頁名片</p>
      </div>

      <div class="content-column">
        <p class="eyebrow">我的專屬電子名片</p>
        <h1 id="pageTitle">隨時開啟，<br>隨時分享。</h1>
        <p class="intro">這個網址專屬於你。MR 更新名片內容後，網址不需要更換，下次打開就能查看最新版本。</p>

        <div class="identity-card">
          <span class="avatar" id="avatar" aria-hidden="true">如</span>
          <span>
            <strong><span id="personName">小如如</span>的電子名片</strong>
            <small>個人專屬・最新版本</small>
          </span>
        </div>

        <div class="actions">
          <button class="primary-action" id="shareButton" type="button">分享我的名片</button>
          <button class="secondary-action" id="copyButton" type="button">複製專屬網址</button>
        </div>
        <p class="action-status" id="actionStatus" role="status" aria-live="polite"></p>
        <p class="tip">建議將這個頁面加入手機主畫面或瀏覽器收藏，日後不必再回到 LINE 對話中尋找名片。</p>
      </div>
    </section>
  </main>
  <script src="./app.js?v=2"></script>
</body>
</html>
